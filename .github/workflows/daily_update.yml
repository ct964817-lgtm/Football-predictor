name: Daily Football Update

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    # 🔧 AGREGAR ESTO PARA EVITAR PROBLEMAS DE RED
    strategy:
      matrix:
        python-version: ['3.11']
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    # 🔧 AGREGAR UN PASO DE VERIFICACIÓN DE RED
    - name: Check network connectivity
      run: |
        ping -c 3 google.com || true
        echo "=== DNS Resolution for Supabase ==="
        nslookup db.cgftpfwrmgpyumkjtvaq.supabase.co || true
        echo "=== IP Addresses ==="
        host db.cgftpfwrmgpyumkjtvaq.supabase.co || true
    
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run ETL Pipeline
      env:
        API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: |
        python src/etl_pipeline.py
